const model=JSON.parse(document.getElementById('model').textContent), $=id=>document.getElementById(id);
const nodes=new Map(model.nodes.map(n=>[n.id,n])), edges=new Map(model.edges.map(e=>[e.id,e]));

function update(){const t=transforms[current];$(current).querySelector('.stage').setAttribute('transform',`translate(${t.x} ${t.y}) scale(${t.k})`)}
function filter(){const service=$('service').value,q=$('search').value.toLowerCase();document.querySelectorAll('.node').forEach(n=>{n.classList.toggle('muted',!!service&&n.dataset.service!==service);n.classList.toggle('highlight',!!q&&n.dataset.name.toLowerCase().includes(q));n.classList.toggle('selected',!!activeNode&&n.dataset.id===activeNode)});document.querySelectorAll('.service').forEach(n=>n.classList.toggle('muted',!!service&&n.dataset.service!==service));document.querySelectorAll('.edge').forEach(n=>n.classList.toggle('muted',!!service&&!n.dataset.services.split(' ').includes(service)));document.querySelectorAll('svg').forEach(n=>n.classList.toggle('hide-details',!$('details').checked));

function focusService(){const id=$('service').value,box=nodeDrags[current].serviceBox(id);if(!box)return;const v=$(current).querySelector('svg').viewBox.baseVal,k=Math.min(12,v.width/(box[2]+160),v.height/(box[3]+100));transforms[current]={k,x:v.width/2-(box[0]+box[2]/2)*k,y:v.height/2-(box[1]+box[3]/2)*k};update()}
function show(id){current=id;$('usecases').hidden=id!=='usecases';$('entities').hidden=id!=='entities';focusService();update()}
$('uc').onclick=()=>show('usecases');$('domain').onclick=()=>show('entities');['service','search','details','interfaces','relations'].forEach(id=>$(id).addEventListener('input',filter));

function centerZoom(f){const v=$(current).querySelector('svg').viewBox.baseVal;zoom(f,v.width/2,v.height/2)}$('plus').onclick=()=>centerZoom(1.2);$('minus').onclick=()=>centerZoom(1/1.2);
// Presentation-only dragging. Semantic model IDs, memberships and metrics are immutable.
function makeMermDrag(canvas, svg, view) {
    const layout = model.layout[view === 'entities' ? 'domain' : 'usecases'];
    const nodeElements = [...canvas.querySelectorAll('.node')];
    const services = [...canvas.querySelectorAll('.service')];
    const edgeElements = [...canvas.querySelectorAll('.edge')];
    const offsets = new Map();
    const originals = new Map();
    let moving = null;
    const offset = element => offsets.get(element) || {x: 0, y: 0};
    const zero = d => Math.abs(d.x) + Math.abs(d.y) < 1e-8;
    const same = (a, b) => Math.abs(a.x-b.x) + Math.abs(a.y-b.y) < 1e-8;
    for (const element of [...nodeElements, ...services]) {
        originals.set(element, element.getAttribute('transform') || '');
    }
    const edgeState = edgeElements.map(element => {
        const edge = edges.get(element.dataset.id);
        const path = element.querySelector('path');
        const geometry = layout.edges && layout.edges[edge.id];
        return {element, edge, path, original: path && path.getAttribute('d'),
                points: geometry && geometry.points,
                labels: [...element.querySelectorAll('.edge-label'), ...element.querySelectorAll('.aggregate-label')]};
    });
    function endpoint(edge, source) {
        const id = source ? edge.source : edge.target;
        const semantic = nodes.get(id);
        if (edge.kind === 'interface') {
            // Overview interfaces attach to service boundaries, not to the port cards.
            return offset(services.find(element => element.dataset.service === semantic.service));
        }
        const targetService = nodes.get(edge.target).service;
        const element = nodeElements.find(element => element.dataset.id === id &&
            (edge.kind !== 'actor-usecase' || !source || element.dataset.service === targetService));
        return offset(element);
    }
    function redraw() {
        for (const state of edgeState) {
            if (!state.path || !state.points || !state.points.length) continue;
            const a = endpoint(state.edge, true), b = endpoint(state.edge, false);
            state.element.removeAttribute('transform');
            for (const label of state.labels) label.removeAttribute('transform');
            if (same(a, b)) {
                state.path.setAttribute('d', state.original);
                if (!zero(a)) state.element.setAttribute('transform', `translate(${a.x} ${a.y})`);
                continue;
            }
            const pts = state.points;
            const start = [pts[0][0]+a.x, pts[0][1]+a.y];
            const last = pts[pts.length-1];
            const end = [last[0]+b.x, last[1]+b.y];
            let c1, c2;
            if (state.edge.kind === 'actor-usecase') {
                const bend = Math.max(32, Math.min(120, Math.abs(end[0]-start[0])/2));
                c1 = [start[0]+bend, start[1]];
                c2 = [end[0]-bend, end[1]];
            } else {
                const first = pts.find(p => p[0] !== pts[0][0] || p[1] !== pts[0][1]) || last;
                const before = [...pts].reverse().find(p => p[0] !== last[0] || p[1] !== last[1]) || pts[0];
                const length = Math.max(36, Math.min(160, Math.hypot(end[0]-start[0], end[1]-start[1])*.3));
                const direction = (from, to) => {
                    const size = Math.hypot(to[0]-from[0], to[1]-from[1]) || 1;
                    return [(to[0]-from[0])/size, (to[1]-from[1])/size];
                };
                const u = direction(pts[0], first), v = direction(last, before);
                c1 = [start[0]+u[0]*length, start[1]+u[1]*length];
                c2 = [end[0]+v[0]*length, end[1]+v[1]*length];
            }
            state.path.setAttribute('d', `M ${start[0]} ${start[1]} C ${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${end[0]} ${end[1]}`);
            for (const label of state.labels) label.setAttribute('transform', `translate(${a.x} ${a.y})`);
        }
    }
    function box(element) {
        if (!element.dataset.id) return layout.services[element.dataset.service];
        const instance = (layout.instances || []).find(i => i.id === element.dataset.id &&
            (i.service || '') === (element.dataset.service || ''));
        return instance ? instance.box : layout.nodes[element.dataset.id];
    }
    return {
        begin(target) {
            const node = target.closest('.node');
            const service = target.closest('.service');
            let elements;
            if (nodeElements.includes(node)) elements = [node];
            else if (services.includes(service)) {
                elements = [service, ...nodeElements.filter(n => n.dataset.service === service.dataset.service)];
            } else return false;
            const entries = elements.map(element => ({element, start: {...offset(element)}, box: box(element)}));
            const bounds = entries.filter(row => row.box).map(({start,box: b}) => [b[0]+start.x,b[1]+start.y,b[2],b[3]]);
            const v = svg.viewBox.baseVal;
            moving = {entries,
                minX: 8-Math.min(...bounds.map(b => b[0])),
                minY: 8-Math.min(...bounds.map(b => b[1])),
                maxX: v.width-8-Math.max(...bounds.map(b => b[0]+b[2])),
                maxY: v.height-8-Math.max(...bounds.map(b => b[1]+b[3]))};
            canvas.style.cursor = 'grabbing';
            return true;
        },
        move(dx, dy) {
            if (!moving) return;
            dx = Math.max(moving.minX, Math.min(moving.maxX, dx));
            dy = Math.max(moving.minY, Math.min(moving.maxY, dy));
            for (const {element, start} of moving.entries) {
                const d = {x: start.x+dx, y: start.y+dy};
                offsets.set(element, d);
                element.setAttribute('transform', `${originals.get(element)} translate(${d.x} ${d.y})`.trim());
            }
            redraw();
        },
        end() { moving = null; canvas.style.cursor = ''; },
        serviceBox(id) {
            const box = layout.services[id];
            if (!box) return null;
            const delta = offset(services.find(element => element.dataset.service === id));
            return [box[0]+delta.x, box[1]+delta.y, box[2], box[3]];
        },
        reset() {
            moving = null;
            offsets.clear();
            for (const [element, original] of originals) {
                if (original) element.setAttribute('transform', original);
                else element.removeAttribute('transform');
            }
            redraw();
        }
    };
}

document.querySelectorAll('.canvas').forEach(canvas=>{const svg=canvas.querySelector('svg'),view=svg.dataset.view==='domain'?'entities':'usecases',nodeDrag=makeMermDrag(canvas,svg,view);nodeDrags[view]=nodeDrag;let drag=null,moved=false;
function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
canvas.addEventListener('wheel',e=>{e.preventDefault();const p=point(e);zoom(e.deltaY<0?1.12:1/1.12,p.x,p.y)},{passive:false});
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=point(e);drag={x:p.x,y:p.y,tx:transforms[current].x,ty:transforms[current].y,scale:transforms[current].k,target:e.target,node:nodeDrag.begin(e.target)};if(drag.node){const n=e.target.closest('.node');if(n){activeNode=n.dataset.id;$('selection').textContent=JSON.stringify(nodes.get(activeNode),null,2);filter()}}moved=false;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.x,dy=p.y-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;if(!moved)return;if(drag.node){nodeDrag.move(dx/drag.scale,dy/drag.scale)}else{transforms[current].x=drag.tx+dx;transforms[current].y=drag.ty+dy;update()}});
canvas.addEventListener('pointerup',()=>{if(drag&&!moved){const n=drag.target.closest('[data-id]');if(n){activeNode=nodes.has(n.dataset.id)?n.dataset.id:activeNode;$('selection').textContent=JSON.stringify(nodes.get(n.dataset.id)||edges.get(n.dataset.id),null,2);filter()}}nodeDrag.end();drag=null});canvas.addEventListener('pointercancel',()=>{nodeDrag.end();drag=null});
canvas.addEventListener('lostpointercapture',()=>{nodeDrag.end();drag=null});
canvas.addEventListener('keydown',e=>{if(e.key==='Enter'){const n=e.target.closest('[data-id]');if(n){activeNode=nodes.has(n.dataset.id)?n.dataset.id:activeNode;$('selection').textContent=JSON.stringify(nodes.get(n.dataset.id)||edges.get(n.dataset.id),null,2);filter()}}})});
$('download').onclick=()=>{const copy=$(current).querySelector('svg').cloneNode(true);copy.querySelector('.stage').removeAttribute('transform');const blob=new Blob([new XMLSerializer().serializeToString(copy)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=model.name+'-'+current+'.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
